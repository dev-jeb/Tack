name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.4 and luarocks
        run: |
          brew install lua@5.4 luarocks

      - name: Install dependencies
        run: |
          luarocks --lua-dir=/opt/homebrew/opt/lua@5.4 install --lua-version 5.4 --tree deps fsm 1.1.0-1
          luarocks --lua-dir=/opt/homebrew/opt/lua@5.4 install --lua-version 5.4 --tree deps lustache 1.3.1-0
          luarocks --lua-dir=/opt/homebrew/opt/lua@5.4 install --lua-version 5.4 --tree deps middleclass 4.1.1-0

      - name: Build spoon
        run: |
          mkdir -p dist/build
          cp -r deps dist/build/deps
          (cd src && for file in *.lua *.html *.css; do cp "$file" ../dist/build/; done)
          cp -r src/entities dist/build/entities
          cp -r src/osascripts dist/build/osascripts
          cp -r bin dist/build/bin
          cp -r dist/build dist/Tack.spoon
          cd dist && zip -r Tack.spoon.zip Tack.spoon

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Tack.spoon.zip
          generate_release_notes: true
